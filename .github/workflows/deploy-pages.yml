# Builds the React frontend and publishes it to GitHub Pages.
# Setup: repo Settings → Pages → Source: "GitHub Actions".
# Set repo Settings → Secrets and variables → Actions → Variables → VITE_API_URL
# to your backend URL (e.g. https://mpr-jewellery-api.onrender.com).
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: client
        run: npm install
      - name: Build
        working-directory: client
        env:
          VITE_ROUTER_MODE: hash            # works on GitHub Pages without server rewrites
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          # Without a backend URL, the site runs as a read-only catalogue from client/public/static-data
          VITE_STATIC_DATA: ${{ vars.VITE_API_URL == '' && 'true' || 'false' }}
        run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
